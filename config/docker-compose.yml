version: '3.9'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: aspasia_postgres
    environment:
      POSTGRES_DB: aspasia
      POSTGRES_USER: aspasia
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aspasia_dev_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aspasia"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aspasia_network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: aspasia_redis
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aspasia_network

  # Aspasia Bot
  aspasia:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: aspasia_bot
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # Core
      CLAUDE_API_KEY: ${CLAUDE_API_KEY}
      CLAUDE_MODEL: claude-3-5-sonnet-20241022
      CLAUDE_MAX_TOKENS: 2048

      # Agent
      AGENT_NAME: Aspasia
      AGENT_MEMORY_SIZE: 50
      AGENT_TIMEOUT_SECONDS: 30

      # Telegram (optional)
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_WEBHOOK_URL: ${TELEGRAM_WEBHOOK_URL:-}

      # Web Server
      WEB_HOST: 0.0.0.0
      WEB_PORT: 8000
      WEB_DEBUG: "false"
      WEB_CORS_ORIGINS: http://localhost:3000,https://your-domain.com

      # Database
      DATABASE_URL: postgresql://aspasia:${POSTGRES_PASSWORD:-aspasia_dev_password}@postgres:5432/aspasia

      # Redis
      REDIS_URL: redis://redis:6379/0
      REDIS_ENABLED: "true"

      # Logging
      LOG_LEVEL: INFO
      LOG_FORMAT: json
      LOG_FILE: ./logs/aspasia.log

      # Security
      ALLOW_ADMIN_ENDPOINTS: "true"
      REQUIRE_API_KEY: "false"

      # Environment
      ENVIRONMENT: production

    ports:
      - "8000:8000"
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - aspasia_network
    restart: unless-stopped

  # Nginx Reverse Proxy (optional)
  nginx:
    image: nginx:alpine
    container_name: aspasia_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - aspasia
    networks:
      - aspasia_network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  aspasia_network:
    driver: bridge
