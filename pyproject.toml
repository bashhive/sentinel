[project]
name = "aspasia-bot"
version = "2.0.0"
description = "Multi-site reusable AI bot — core + adapters + profiles"
requires-python = ">=3.11"

dependencies = [
    # AI
    "anthropic>=0.85.0",
    # Web adapter
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    # Telegram adapter (optional — only needed when profile enables it)
    "python-telegram-bot>=21.5",
    # Utils
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",      # TestClient
    "ruff>=0.4.0",
]

[project.scripts]
aspasia = "main:main"

[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.backends.legacy:build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
