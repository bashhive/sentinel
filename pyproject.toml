[project]
name = "hivesec-sentinel-bot"
version = "2.1.0"
description = "HiveSec Sentinel — multi-site reusable AI security bot (core + adapters + profiles)"
requires-python = ">=3.11"

# Default (free-tier) path needs no vendor SDK — just httpx against an
# OpenAI-compatible endpoint (Groq, Gemini-OpenAI, OpenRouter, local).
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "python-telegram-bot>=21.5",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
# Only needed if LLM_PROVIDER=anthropic (paid).
anthropic = [
    "anthropic>=0.85.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio==0.23.8",
    "httpx>=0.27.0",
    "ruff>=0.4.0",
]

[project.scripts]
hivesec-sentinel = "main:main"

[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
exclude = ["_archive*", "tests*", ".venv*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
